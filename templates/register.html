{% extends 'base_no_nav.html' %}
{% load static %}

{% block title %}Register User{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Register New User</h4>
                    <a href="/" class="btn btn-outline-light">
                        <i class="fas fa-home me-2"></i>Back to Home
                    </a>
                </div>
                <div class="card-body">
                    {% if success %}
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="fas fa-check-circle me-2"></i>{{ success }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}

                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}

                    <div class="row">
                        <div class="col-md-6">
                            <canvas id="mycanvas" width="540" height="390" class="border border-2 border-primary rounded w-100"></canvas>
                        </div>
                        <div class="col-md-6">
                            <form action="/register" method="POST" onsubmit="return captureAndSubmit();">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="exampleFormControlInput1" class="form-label">Name</label>
                                    <input type="text" class="form-control" name="name" id="exampleFormControlInput1" placeholder="Enter Your Name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="exampleFormControlInput2" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" name="numbe" id="exampleFormControlInput2" placeholder="Enter Your Number" required>
                                </div>
                                <div class="mb-3">
                                    <label for="exampleFormControlInput3" class="form-label">Email</label>
                                    <input type="email" class="form-control" name="emailid" id="exampleFormControlInput3" placeholder="Enter Your Email" required>
                                </div>
                                <input type="hidden" id="capturedImageData" name="capturedImageData">
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-user-plus me-2"></i>Register User
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var c = document.getElementById('mycanvas');
    var ctx = c.getContext("2d");
    var webcamVideo = document.createElement('video');

    navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(stream) {
            webcamVideo.srcObject = stream;
            webcamVideo.play();
            drawVideoToCanvas();
        })
        .catch(function(error) {
            console.error('Error accessing webcam:', error);
            c.parentElement.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i>Failed to access webcam. Please make sure your camera is connected and you have granted permission.</div>';
        });

    function drawVideoToCanvas() {
        ctx.drawImage(webcamVideo, 0, 0, c.width, c.height);
        requestAnimationFrame(drawVideoToCanvas);
    }

    function captureAndSubmit() {
        try {
            captureImage();
            return true;
        } catch (error) {
            console.error('Error capturing image:', error);
            alert('Failed to capture image. Please try again.');
            return false;
        }
    }

    function captureImage() {
        ctx.drawImage(webcamVideo, 0, 0, c.width, c.height);
        var dataURL = c.toDataURL('image/png');
        document.getElementById('capturedImageData').value = dataURL;
        webcamVideo.pause();
        webcamVideo.srcObject.getTracks().forEach(track => track.stop());
    }
</script>
{% endblock %}
