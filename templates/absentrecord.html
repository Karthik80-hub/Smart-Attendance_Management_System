{% extends 'base_no_nav.html' %}
{% load static %}

{% block title %}Absence History{% endblock %}

{% block content %}
<div class="container">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Complete Absence History</h4>
            <div>
                <a href="/absenties" class="btn btn-outline-light me-2">
                    <i class="fas fa-calendar-day me-2"></i>Today's Absences
                </a>
                <a href="/" class="btn btn-outline-light">
                    <i class="fas fa-home me-2"></i>Back to Home
                </a>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in value %}
                        <tr>
                            <td>{{ s.namee }}</td>
                            <td>{{ s.dat }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-center py-4">
                                <div class="text-muted">
                                    <i class="fas fa-check-circle me-2"></i>No absence records found
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
