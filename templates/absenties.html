{% extends 'base_no_nav.html' %}
{% load static %}

{% block title %}Absences{% endblock %}

{% block content %}
<div class="container">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Today's Absences</h4>
            <div>
                <a href="/absentrecord" class="btn btn-outline-light me-2">
                    <i class="fas fa-history me-2"></i>View All Records
                </a>
                <a href="/" class="btn btn-outline-light">
                    <i class="fas fa-home me-2"></i>Back to Home
                </a>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in absent_students %}
                        <tr>
                            <td>{{ student.nam }}</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td class="text-center py-4">
                                <div class="text-muted">
                                    <i class="fas fa-check-circle me-2"></i>No absences recorded for today
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
